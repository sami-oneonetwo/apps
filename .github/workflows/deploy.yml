name: deploy

# main            -> <app>.apps.fatherbean.com          (wrangler deploy)
# any other branch -> <app>-preview.apps.fatherbean.com (wrangler deploy --env preview)
# Only apps whose folder changed are deployed. Shared-file changes deploy everything.

on:
  push:
    branches: ["**"]
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/changed-apps.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      app:
        description: 'Folder under apps/ to deploy, or "all"'
        required: true
        default: all
      target:
        description: Where to deploy
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      target: ${{ steps.pick.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            if [[ "${{ inputs.app }}" == "all" ]]; then
              apps="$(bash scripts/changed-apps.sh "" HEAD)"
            else
              test -d "apps/${{ inputs.app }}" || { echo "::error::apps/${{ inputs.app }} not found"; exit 1; }
              apps='["${{ inputs.app }}"]'
            fi
          else
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              target=production
              base="${{ github.event.before }}"
            else
              target=preview
              base="${{ github.event.before }}"
              # New branch: compare against where it forked from main.
              if [[ "$base" =~ ^0+$ ]]; then
                base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
              fi
            fi
            apps="$(bash scripts/changed-apps.sh "$base" "${{ github.sha }}")"
          fi
          echo "apps=$apps"     | tee -a "$GITHUB_OUTPUT"
          echo "target=$target" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: ${{ matrix.app }} (${{ needs.plan.outputs.target }})
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - name: Check secrets
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings > Secrets and variables > Actions"
            exit 1
          }

      - name: Deploy
        working-directory: apps/${{ matrix.app }}
        run: |
          if [[ "${{ needs.plan.outputs.target }}" == "production" ]]; then
            npx wrangler deploy
            host="${{ matrix.app }}.apps.fatherbean.com"
          else
            npx wrangler deploy --env preview
            host="${{ matrix.app }}-preview.apps.fatherbean.com"
          fi
          {
            echo "### ${{ matrix.app }} → ${{ needs.plan.outputs.target }}"
            echo ""
            echo "https://$host"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` on \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
